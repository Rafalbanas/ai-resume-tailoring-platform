apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvtailor
  namespace: cvtailor-lab
spec:
  replicas: 1
  # SQLite and filesystem tasks require a single application instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cvtailor
  template:
    metadata:
      labels:
        app: cvtailor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-sample-data
          image: cvtailor:lab
          imagePullPolicy: Never
          # Examples remain in the image; the PVC mounts at a separate path.
          command: [python, -c]
          args:
            - |
              from pathlib import Path
              import shutil
              root = Path('/lab-data')
              for name in ('master_profile', 'skills'):
                  target = root / (name + '.json')
                  if not target.exists():
                      shutil.copyfile('/app/data/' + name + '.example.json', target)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /lab-data
      containers:
        - name: app
          image: cvtailor:lab
          imagePullPolicy: Never
          # Bypass the Docker entrypoint, which expects root for chown/gosu.
          command: [uvicorn, app.main:app]
          args: [--host, "0.0.0.0", --port, "8000", --no-proxy-headers]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cvtailor-config
            - secretRef:
                name: cvtailor-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /lab-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cvtailor-data
