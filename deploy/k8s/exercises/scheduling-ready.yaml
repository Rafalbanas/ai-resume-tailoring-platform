apiVersion: v1
kind: Pod
metadata:
  name: scheduling-lesson
  namespace: cvtailor-lab
  labels:
    lesson: scheduling
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: lesson
      image: cvtailor:lab
      imagePullPolicy: Never
      command: [python, -u, -c]
      args:
        - "import time; print('Scheduling lesson: container started'); time.sleep(600)"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
