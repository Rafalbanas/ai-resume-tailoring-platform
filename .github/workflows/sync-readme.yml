name: Check README Generated Sections

on:
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'README.md'
      - 'scripts/sync_readme.py'
      - '.github/workflows/sync-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify README dependency sources and Python runtime
        run: python scripts/sync_readme.py --check
