name: Sync README Versions and Metrics

on:
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - 'tests/**'
      - 'scripts/sync_readme.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies for discovery
        run: pip install pytest pytest-asyncio

      - name: Run README sync script
        run: python scripts/sync_readme.py

      - name: Commit and push changes if README was updated
        run: |
          set -euo pipefail
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update dependency versions and test count in README [skip ci]"
            git push
          else
            echo "README.md is already up to date; no changes to commit."
          fi
