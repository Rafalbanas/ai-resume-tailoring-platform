name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify pinned environment
        run: python scripts/check_environment.py --dev && python -m pip check
      - name: Install Chromium for layout regression tests
        run: python -m playwright install --with-deps chromium
      - name: Install native document and sandbox dependencies used by the image
        run: sudo apt-get install --yes --no-install-recommends libharfbuzz-subset0 libseccomp2
      - run: ruff check .
      - run: pytest -q
      - name: Verify README is synced with current versions and test counts
        run: python scripts/sync_readme.py --check

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application image
        run: docker build --tag cvtailor:ci .
      - name: Verify image runtime, document exports and browser
        run: |
          docker run --rm -i --network none --entrypoint python cvtailor:ci - <<'PY'
          import sys
          from io import BytesIO
          from app.main import app
          from app.services.processing import process
          from docx import Document
          from playwright.sync_api import sync_playwright
          from weasyprint import HTML
          from scripts.check_environment import check

          assert sys.version_info[:2] == (3, 14), sys.version
          assert not check(), check()
          assert app is not None
          assert process('check', {}, timeout=10) == {'protocol': 1, 'network_blocked': True}
          pdf = HTML(string="<p>CV Tailor image check</p>").write_pdf()
          assert pdf.startswith(b"%PDF-")
          document = Document()
          document.add_paragraph("CV Tailor image check")
          output = BytesIO()
          document.save(output)
          assert output.getvalue().startswith(b"PK")
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(args=["--no-sandbox"])
              page = browser.new_page()
              page.set_content("<title>CV Tailor image check</title>")
              assert page.title() == "CV Tailor image check"
              browser.close()
          print("Python 3.14, application imports, PDF/DOCX exports and Chromium OK")
          PY

  split-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build role images with shared dependency layers
        run: |
          for role in api documents browser; do
            docker build --target "$role" --tag "cvtailor:split-$role" .
          done
      - name: Check role dependencies and native processing
        run: |
          for role in api documents browser; do
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
              --entrypoint python "cvtailor:split-$role" -m scripts.check_runtime_image "$role"
          done
      - name: Check isolated API to worker RPC and startup
        run: scripts/check_split_runtime.sh
      - name: Report image sizes
        run: docker image ls --filter reference='cvtailor:split-*'
