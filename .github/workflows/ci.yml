name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium for layout regression tests
        run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest -q

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application image
        run: docker build --tag cvtailor:ci .
      - name: Verify image runtime and PDF dependencies
        run: |
          docker run --rm -i --network none --entrypoint python cvtailor:ci - <<'PY'
          import sys
          from app.main import app
          from weasyprint import HTML

          assert sys.version_info[:2] == (3, 12), sys.version
          assert app is not None
          pdf = HTML(string="<p>CV Tailor image check</p>").write_pdf()
          assert pdf.startswith(b"%PDF-")
          print("Python 3.12, application imports and PDF rendering OK")
          PY
