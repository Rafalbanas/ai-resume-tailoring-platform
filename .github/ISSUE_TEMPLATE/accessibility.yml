name: Accessibility barrier
description: Report a barrier affecting the interface, previews, or exported documents.
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for describing the barrier. A diagnosis or medical history is not needed.
        This issue is public; use fictional data and redact screenshots/logs.
  - type: textarea
    id: task
    attributes:
      label: Task and affected area
      description: What were you trying to do? Was the barrier in the web UI, preview, PDF, or DOCX?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed barrier
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or helpful alternative
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment, if you wish to share
      description: Browser/OS versions, assistive technology, zoom level, input method, and application revision if known.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no private CV data, medical details, or credentials.
          required: true
